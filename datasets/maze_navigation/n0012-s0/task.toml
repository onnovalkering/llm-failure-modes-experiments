version = "1.0"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 720

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240

[[environment.mcp_servers]]
name = "maze"
transport = "streamable-http"
url = "http://maze:8000/mcp"

# The run recording lives in the sidecar, out of the agent's reach. Lands in `artifacts/maze/`.
[[artifacts]]
source = "/srv/run"
destination = "maze"
service = "maze"
