services:
  main:
    depends_on:
      maze:
        condition: service_healthy

  maze:
    build:
      context: ./maze-server
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
